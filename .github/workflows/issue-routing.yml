name: Issue routing

on:
  issues:
    types: [opened, reopened]

permissions: {}

concurrency:
  group: issue-routing-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out routing logic
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Comment with deterministic routing result
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const moduleUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/issue-routing.mjs`);
            const { classifyAgentLabels, formatRoutingComment, hasRoutingComment, routingCommentMarker } = await import(moduleUrl.href);
            const { owner, repo, number } = context.issue;
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number });
            const marker = routingCommentMarker(context.payload.action, context.payload.issue.updated_at);
            const result = classifyAgentLabels(issue.labels);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: number,
              per_page: 100,
            });

            if (hasRoutingComment(comments, marker)) {
              core.info('A routing comment already exists for this Issue event.');
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body: formatRoutingComment(result, marker),
              });
            }
